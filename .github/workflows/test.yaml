name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquaproj/aqua-installer@v3
        with:
          aqua_version: v2.55.1

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Run tests
        run: cargo test --verbose

      - name: Build
        run: cargo build --verbose
